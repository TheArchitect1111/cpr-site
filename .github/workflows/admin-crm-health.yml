name: CPR Admin CRM Health

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cpr-admin-crm-health
  cancel-in-progress: true

env:
  CRM_URL: https://www.cprglobalsports.com/admin/crm

jobs:
  verify-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify CRM route is live and protected
        id: initial
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            body="$(mktemp)"
            code="$(curl -sS -L --max-redirs 5 -o "$body" -w '%{http_code}' "$CRM_URL")"
            effective="$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{url_effective}' "$CRM_URL")"
            test "$code" = "200"
            case "$effective" in
              https://www.cprglobalsports.com/admin/login*|https://www.cprglobalsports.com/admin/crm*) ;;
              *) echo "Unexpected CRM destination: $effective" >&2; return 1 ;;
            esac
            grep -Eq 'CPR ADMIN|CRM &amp; Opportunity Center|CRM & Opportunity Center' "$body"
            echo 'CPR admin CRM route is healthy and access-controlled.'
          }
          verify

      - name: Trigger recovery deployment through Git push
        if: steps.initial.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name 'CPR CRM Health Guard'
          git config user.email 'actions@users.noreply.github.com'
          git commit --allow-empty -m 'chore: recover CPR admin CRM deployment'
          git push origin HEAD:main
          sleep 90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify after recovery
        id: recovery
        if: steps.initial.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -L --max-redirs 5 -o "$body" -w '%{http_code}' "$CRM_URL")"
          effective="$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{url_effective}' "$CRM_URL")"
          test "$code" = "200"
          case "$effective" in
            https://www.cprglobalsports.com/admin/login*|https://www.cprglobalsports.com/admin/crm*) ;;
            *) exit 1 ;;
          esac
          grep -Eq 'CPR ADMIN|CRM &amp; Opportunity Center|CRM & Opportunity Center' "$body"

      - name: Open production incident
        if: steps.initial.outcome == 'failure' && steps.recovery.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Production] CPR admin CRM health failed';
            const body = [
              'The CPR Admin CRM health guard found the CRM route unavailable, misrouted, or no longer access-controlled.',
              '',
              `Checked: ${process.env.CRM_URL}`,
              '',
              'An automatic recovery deployment was attempted before this incident was opened.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Fail unresolved incident
        if: steps.initial.outcome == 'failure' && steps.recovery.outcome != 'success'
        run: exit 1
